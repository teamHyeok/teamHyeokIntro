<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>팀혁 매거진</title>
    <link rel="icon" type="image/svg+xml" href="../favicon.svg">
    <link rel="stylesheet" href="../assets/css/main.css">
</head>
<body>
    <div class="page-frame" style="opacity:1; transform:none; filter:none; box-shadow:none;">
        <header class="top-bar">
            <div class="container top-bar__inner">
                <a href="../" class="brand" aria-label="팀혁 홈으로">TEAMHYEOK</a>
                <nav class="nav" aria-label="Primary">
                    <a href="../#about">About</a>
                    <a href="./">Magazine</a>
                    <a href="../#apps">Works</a>
                </nav>
            </div>
        </header>

        <main class="section container">
            <div class="section__header">
                <span class="section__eyebrow">Inspiration Magazine</span>
                <h2>팀혁 매거진</h2>
                <p>가장 최근 글이 메인에 노출되고, 모든 글은 여기서 찾아볼 수 있습니다.</p>
            </div>

            <div class="magazine-archive" id="magazineArchive">
                <div class="magazine-list" id="magazineList"></div>
                <article class="magazine-detail" id="magazineDetail">
                    <p class="magazine-empty">매거진을 선택하면 전체 글을 볼 수 있습니다.</p>
                </article>
            </div>
        </main>

        <footer class="site-footer">
            <div class="container site-footer__inner">
                <p>&copy; <span id="currentYear"></span> 팀혁. All rights reserved.</p>
                <a class="footer-link" href="https://github.com/teamhyeok" target="_blank" rel="noopener">GitHub 살펴보기</a>
            </div>
        </footer>
    </div>
    <script src="../assets/js/magazine-page.js"></script>
</body>
</html>
