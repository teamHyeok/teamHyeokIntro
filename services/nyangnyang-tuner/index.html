<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>냥냥 튜너 | 팀혁</title>
    <link rel="stylesheet" href="../../assets/css/main.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="service-body">
    <div class="service-sky service-sky--one" aria-hidden="true"></div>
    <div class="service-sky service-sky--two" aria-hidden="true"></div>
    <div class="service-sky service-sky--three" aria-hidden="true"></div>

    <header class="service-header">
        <div class="container service-header__inner" data-animate>
            <div class="service-header__meta">
                <a class="back-link" href="../../index.html" aria-label="팀혁 소개로 돌아가기">
                    <span class="back-link__icon" aria-hidden="true">←</span>
                    <span class="back-link__label">홈으로</span>
                </a>
                <span class="service-chip">TeamHyeok Works</span>
            </div>
            <h1 class="service-header__title">냥냥 튜너</h1>
            <p class="service-header__subtitle">귀여운 고양이 튜너</p>
        </div>
    </header>

    <main class="service-main">
        <section class="container service-hero">
            <div class="hero__copy" data-animate>
                <h2 class="hero__headline">칙칙한 튜너는 가라! <span>귀여운 고양이와 함께 하는 튜닝 경험</span></h2>
                <p class="hero__description">냥냥 튜너는 초보자부터 전문가까지 누구나 쉽게 사용할 수 있는 악기 튜닝 도구입니다. 기타뿐 아니라 베이스등 범용적으로 사용 가능합니다. 칙칙한 튜닝 시간을 귀여운 고양이와 함께 즐겁게 바꿔보세요!</p>
                <div class="hero-badges">
                    <span class="hero-badge">Music Utility</span>
                </div>
            </div>

            <div class="hero__visual" data-animate>
                <div class="mascot-stage" aria-hidden="true">
                    <span class="mascot-stage__halo"></span>
                    <span class="mascot-stage__ring"></span>
                    <span class="mascot-stage__glow"></span>
                    <svg class="mascot-illustration" viewBox="0 0 260 260" role="img" aria-labelledby="mascotTitle mascotDesc">
                        <title id="mascotTitle">리듬을 타는 냥냥 튜너 마스코트</title>
                        <desc id="mascotDesc">고양이 캐릭터가 음악 노트와 함께 떠다니며 튜닝을 돕고 있습니다.</desc>
                        <defs>
                            <linearGradient id="stageBody" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" stop-color="#ffe5ff" />
                                <stop offset="100%" stop-color="#b5c3ff" />
                            </linearGradient>
                            <linearGradient id="stageAccent" x1="0%" y1="0%" x2="100%" y2="0%">
                                <stop offset="0%" stop-color="#fff6b7" />
                                <stop offset="100%" stop-color="#ff9acb" />
                            </linearGradient>
                            <linearGradient id="stageTail" x1="0%" y1="0%" x2="0%" y2="100%">
                                <stop offset="0%" stop-color="#ffdff5" />
                                <stop offset="100%" stop-color="#96b5ff" />
                            </linearGradient>
                        </defs>
                        <ellipse class="mascot-shadow" cx="130" cy="226" rx="78" ry="26" />
                        <g class="mascot-cat" transform="translate(40 22)">
                            <path class="mascot-tail" d="M156 116c28-10 48 22 18 38-20 12-40-10-36-26 2-10 8-18 18-12z" fill="url(#stageTail)" />
                            <g class="mascot-body-group">
                                <rect class="mascot-body" x="34" y="54" rx="48" ry="48" width="128" height="132" fill="url(#stageBody)" />
                                <rect class="mascot-belly" x="68" y="98" rx="32" ry="32" width="68" height="80" fill="#fff8ff" />
                                <circle class="mascot-blush mascot-blush--left" cx="70" cy="130" r="12" fill="url(#stageAccent)" />
                                <circle class="mascot-blush mascot-blush--right" cx="128" cy="130" r="12" fill="url(#stageAccent)" />
                            </g>
                            <g class="mascot-head" transform="translate(24 -4)">
                                <path class="mascot-ear mascot-ear--left" d="M38 58c-12-26 16-46 32-26 5 8 2 18-6 26-8 8-22 8-26 0z" fill="url(#stageAccent)" />
                                <path class="mascot-ear mascot-ear--right" d="M120 58c6-28 38-24 36 4-2 12-14 20-28 18-10-2-14-12-8-22z" fill="url(#stageAccent)" />
                                <rect class="mascot-head__shape" x="44" y="24" width="96" height="96" rx="42" ry="42" fill="url(#stageBody)" />
                                <g class="mascot-eyes" transform="translate(0 24)">
                                    <ellipse class="mascot-eye mascot-eye--left" cx="76" cy="58" rx="10" ry="18" fill="#221b39" />
                                    <ellipse class="mascot-eye mascot-eye--right" cx="120" cy="58" rx="10" ry="18" fill="#221b39" />
                                </g>
                                <path class="mascot-mouth" d="M102 102c8 10 22 10 30 0" stroke="#221b39" stroke-width="4" stroke-linecap="round" fill="none" />
                                <circle class="mascot-nose" cx="116" cy="86" r="6" fill="#ff8f98" />
                            </g>
                        </g>
                    </svg>
                    <span class="floating-note floating-note--one" data-depth="0.25"><span>♪</span></span>
                    <span class="floating-note floating-note--two" data-depth="0.32"><span>♩</span></span>
                    <span class="floating-note floating-note--three" data-depth="0.18"><span>♫</span></span>
                </div>
            </div>
        </section>
    </main>

    <footer class="service-footer">
        <div class="container">
            <p>&copy; <span id="currentYear"></span> 팀혁. All rights reserved.</p>
        </div>
    </footer>

    <script src="../../assets/js/main.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
