<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>팀혁 소개</title>
    <link rel="stylesheet" href="assets/css/main.css">
</head>
<body>
    <header class="site-header">
        <div class="container">
            <h1 class="site-title">팀혁 소개</h1>
            <p class="site-tagline">우리가 만들고 싶은 걸 만드는 팀, 팀혁을 소개합니다.</p>
        </div>
    </header>

    <main class="site-content">
        <section class="intro-section container">
            <h2>팀혁이란?</h2>
            <p>팀혁은 4인의 개발자로 구성된 소규모 팀으로, 구현 우선과 최저 비용을 목표로 합니다. 만들고 싶은 제품을 25일 이내에 완성하며, 완성된 프로젝트는 과감하게 다음 단계로 나아갑니다.</p>
        </section>

        <section class="apps-section container">
            <div class="section-header">
                <h2>팀혁이 만든 것들</h2>
                <p>새로운 서비스가 추가될 때마다 이곳에서 만날 수 있어요.</p>
            </div>

            <div class="app-grid" id="appList">
                <!-- 앱 카드들이 자바스크립트로 생성됩니다. -->
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>&copy; <span id="currentYear"></span> 팀혁. All rights reserved.</p>
        </div>
    </footer>

    <script src="assets/js/main.js"></script>
</body>
</html>
