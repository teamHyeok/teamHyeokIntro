<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="유술가들 아이콘">
  <defs>
    <linearGradient id="yg-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16171c"/>
      <stop offset="1" stop-color="#08090b"/>
    </linearGradient>
    <linearGradient id="yg-belt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2c34"/>
      <stop offset="0.5" stop-color="#15161b"/>
      <stop offset="1" stop-color="#0c0d11"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="22" fill="url(#yg-bg)"/>
  <!-- black belt band -->
  <rect x="0" y="40" width="100" height="24" fill="url(#yg-belt)"/>
  <rect x="0" y="40" width="100" height="1.4" fill="#3a3d47"/>
  <rect x="0" y="62.6" width="100" height="1.4" fill="#000" opacity="0.6"/>
  <!-- red rank bars (signature: 검정 띠 + 빨간 두 줄) -->
  <rect x="60" y="40" width="7" height="24" fill="#e2342b"/>
  <rect x="71" y="40" width="7" height="24" fill="#e2342b"/>
</svg>
