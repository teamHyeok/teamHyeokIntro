  <text x="240" y="520" fill="#E8EDFF" font-size="36" font-family="'Noto Sans KR', 'Pretendard', sans-serif" font-weight="700">우리가 쓰고 싶은가?  ·  3일 내 뼈대 제작 가능한가?  ·  유지비 최소화 가능한가?</text>
